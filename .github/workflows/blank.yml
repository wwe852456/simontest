name: Deploy to Windows B

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy to D drive
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $source = $env:GITHUB_WORKSPACE
          $destination = "C:\Users\simon\Desktop\simontest"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          robocopy $source $destination /E /XD .git

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0
