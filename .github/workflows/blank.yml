
name: Deploy to Windows B

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-windows-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, windows-b]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to B Computer
        run: |
          $source = $env:GITHUB_WORKSPACE
          $target = "G:\Code\aaa\simontest"

          New-Item -ItemType Directory `
            -Force -Path $target | Out-Null

          robocopy $source $target /MIR `
            /XD .git .github `
            /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed: $LASTEXITCODE"
          }

          exit 0

      - name: Show Deployment Result
        run: |
          Write-Host "Deployment completed"
          Write-Host "Commit: $env:GITHUB_SHA"
